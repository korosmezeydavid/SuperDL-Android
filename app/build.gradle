plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.superdl.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.superdl.launcher"
        minSdk 26
        targetSdk 34
        versionCode 120
        versionName "1.63.10"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                v1SigningEnabled true
                v2SigningEnabled true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildFeatures {
        // A saját fordítási kapcsolókhoz (pl. FEATURE_MONEY_RECOGNIZER).
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            // A PÉNZFELISMERŐ csak a fejlesztői változatban érhető el.
            // A fejlesztő döntése: amíg nincs 100 százalékig biztos, hogy SOHA
            // nem mond téves címletet, addig NEM kerül a tesztelők kezébe.
            // Egy téves összeg vak embernél valódi anyagi kárt okoz — ez nem
            // olyan hiba, amit "majd a teszt kiszűr".
            buildConfigField "boolean", "FEATURE_MONEY_RECOGNIZER", "true"
            // A HIBATŰRÉS PRÓBÁJA a fejlesztői és a TESZT változatban látszik.
            buildConfigField "boolean", "FEATURE_FAILURE_TEST", "true"
        }
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            // A tesztverzióban KIKAPCSOLVA. Egy sor átírásával visszakapcsolható,
            // amikor a fejlesztő késznek ítéli.
            buildConfigField "boolean", "FEATURE_MONEY_RECOGNIZER", "false"
            // Az ÉLES változatból KIMARAD: egy átlagos felhasználó soha nem
            // nézné meg, csak zsúfolná a menüt. A tesztidőszakban viszont
            // hasznos, hogy a tesztelők is meggyőződhessenek a hibatűrésről —
            // a teszt-csomagot ezért a fejlesztői változatból adjuk ki.
            buildConfigField "boolean", "FEATURE_FAILURE_TEST", "false"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        viewBinding true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    androidResources {
        noCompress 'tflite'
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def buildType = variant.buildType.name
            output.outputFileName = "SuperDL-${variant.versionName}-${buildType}.apk"
        }
    }
}

dependencies {
    // GÉPRŐL GÉPRE FÁJLKÜLDÉS (magic-wormhole).
    //
    // A `libs/whmobile.aar` a `wormhole-go` mappa Go forrásából készül,
    // gomobile-lal — az építőszkript: `tools/build_wormhole_aar.ps1`.
    // MIÉRT ÍGY: a windowsos SuperDL p2p modulja is magic-wormhole-t
    // használ; ugyanaz a protokoll, ugyanaz a kód-szótár, tehát a telefon
    // és a gép EGYMÁSNAK tud küldeni. Androidra nincs parancssori
    // wormhole, amit alfolyamatként lehetne hajtani, ezért a protokoll
    // beforgatott könyvtárként érkezik (wormhole-william, MIT licenc).
    //
    // Az AAR bent van a tárolóban, hogy a program a Go eszközlánc nélkül
    // is fordítható maradjon; újraépíteni csak akkor kell, ha a Go forrás
    // változik.
    implementation files('libs/whmobile.aar')

    // Titkosított tárolás érzékeny adatokhoz (pl. e-mail jelszó):
    // a kulcsot az eszköz hardveres kulcstárolója (Keystore) védi.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    def camerax_version = '1.3.1'
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation "androidx.camera:camera-video:$camerax_version"
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    // MP3-KÓDOLÓ A RÁDIÓFELVÉTELHEZ.
    //
    // A RÉGI TÁMOGATÓ KÖNYVTÁR TELJES KIZÁRÁSA — ÉS MIÉRT.
    //
    // A HIBA, AMIT EZ JAVÍT (Mezei Géza, 2026-09-10, 1.63.6 KIADÁSI változat):
    // a YouTube takarékos módja összeomlott, amint elindult volna a hang.
    //
    //   java.lang.NoClassDefFoundError: android/support/v4/util/ArrayMap
    //   at android.support.v4.media.MediaMetadataCompat.<clinit>
    //   at YoutubeAudioService.setupMediaSession
    //
    // Ez a csomag behúzta a 2017-es `com.android.support:support-v4:26.1.0`
    // egész családját, benne a `support-media-compat`-ot — ONNAN jött a
    // MediaSessionCompat és a MediaMetadataCompat. A `support-compat`-ot
    // viszont korábban KIZÁRTUK, mert ütközött az AndroidX-szel. Csakhogy az
    // `ArrayMap` épp abban lakik.
    //
    // Fordításkor ebből semmi nem látszik: a media-compat osztályok ott
    // vannak. Futásidőben, a legelső `setMetadata` hívásnál dől el, hogy a
    // fele hiányzik. Egy funkció volt halott a kiadási változatban, miközben
    // a fejlesztőiben tökéletesen működött.
    //
    // MEGOLDÁS: a régi könyvtárból SEMMIT nem engedünk be. A media-compat
    // osztályokat az androidx.media adja (ugyanazon a csomagnéven, de
    // AndroidX alapokon) — így egyetlen forrás van, nem kettő fél.
    //
    // A kizárás biztonságos: a `support-compat` már eddig is ki volt zárva,
    // és a felvétel ettől függetlenül működött — tehát ez a csomag futás
    // közben nem használja a régi támogató osztályokat.
    implementation('com.github.naman14:tandroidlame:1.1') {
        exclude group: 'com.android.support'
    }

    // MÉDIA-MUNKAMENET (fülhallgató gombja, autórádió, zárképernyő).
    // Ez adja a MediaSessionCompat és a MediaMetadataCompat osztályokat.
    // Lásd a fenti magyarázatot: enélkül a régi támogató könyvtár félkész
    // maradéka szolgálta ki őket.
    implementation 'androidx.media:media:1.7.0'

    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
}